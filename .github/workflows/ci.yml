name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,windows]"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: pip install -e ".[dev]"

      - name: Run test suite with coverage gate (Windows)
        if: runner.os == 'Windows'
        run: pytest tests/ -q --cov=src --cov-fail-under=80

      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: pytest tests/ -q --cov=src --cov-report=term
