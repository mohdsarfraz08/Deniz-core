# To get started with Dependabot version updates, please read the documentation:
# https://docs.github.com/github/administering-a-repository/keeping-your-dependencies-updated-automatically

version: 2
updates:
  # Enable version updates for pip (Python) dependencies (covers requirements.txt and pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
