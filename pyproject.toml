[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-v1"
version = "0.1.0"
description = "Rule-based CLI assistant (intent → core → OS adapters)"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "psutil==7.2.2",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve imports when tests run before an editable install (CI bootstrap).
pythonpath = ["src", "tests"]
markers = [
    "windows_only: requires Windows APIs (pywin32, os.startfile, subprocess paths)",
]

[tool.coverage.run]
source = ["src"]
omit = []

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
